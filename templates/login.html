<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makix Studio | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* M365 Light colors */
            --bg-base: #f3f2f1;
            --bg-surface: #ffffff;
            --border-main: #d2d0ce;
            --accent-primary: #0078d4;
            --accent-hover: #005a9e;
            --accent-vibrant: #deecf9;
            --text-main: #323130;
            --text-dim: #605e5c;
            --error: #a80000;
            --error-bg: #fde8e8;
            --shadow: 0 6.4px 14.4px 0 rgba(0, 0, 0, 0.132), 0 1.2px 3.6px 0 rgba(0, 0, 0, 0.108);
        }

        body.dark-theme {
            /* M365 Dark colors */
            --bg-base: #1f1f1f;
            --bg-surface: #292929;
            --border-main: #484644;
            --accent-primary: #479ef5;
            --accent-hover: #6cb0f6;
            --accent-vibrant: #1f2c3a;
            --text-main: #f3f2f1;
            --text-dim: #c8c6c4;
            --error: #f1707a;
            --error-bg: #442726;
            --shadow: 0 6.4px 14.4px 0 rgba(0, 0, 0, 0.24), 0 1.2px 3.6px 0 rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 8px;
            padding: 2.5rem;
            position: relative;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .login-header {
            text-align: left;
            margin-bottom: 0.5rem;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background: var(--accent-primary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .logo-box svg { width: 18px; height: 18px; }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--text-dim);
            pointer-events: none;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            height: 38px;
            padding: 0 0.75rem 0 2.25rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-vibrant);
        }

        .btn-login {
            width: 100%;
            height: 38px;
            background: var(--accent-primary);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: var(--error-bg);
            border: 1px solid var(--error);
            border-radius: 4px;
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
            color: var(--error);
        }

        .error-msg.show { display: flex; }
        .error-msg svg { width: 14px; height: 14px; flex-shrink: 0; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    </script>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-row">
                <div class="logo-box">
                    <i data-lucide="waves"></i>
                </div>
                <span class="brand-name">Makix Studio</span>
            </div>
            <h1>Sign in</h1>
            <p class="subtitle">to access your professional AI voice workspace</p>
        </div>

        <div class="error-msg" id="errorMsg">
            <i data-lucide="alert-circle"></i>
            <span id="errorText">Invalid credentials</span>
        </div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i data-lucide="log-in"></i>
                <span>Login</span>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            btn.disabled = true;
            errorMsg.classList.remove('show');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorText.textContent = data.detail || 'Invalid credentials';
                    errorMsg.classList.add('show');
                    lucide.createIcons();
                }
            } catch (err) {
                errorText.textContent = 'Connection error. Please try again.';
                errorMsg.classList.add('show');
                lucide.createIcons();
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
